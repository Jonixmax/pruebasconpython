<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Terminal de Diagnóstico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --color-primario: #00ffcc;
            --color-fondo: #001a14;
        }

        body { 
            background-color: #020202; 
            color: var(--color-primario); 
            font-family: 'Courier New', Courier, monospace; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
            background-image: radial-gradient(circle, var(--color-fondo) 0%, #020202 90%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1, h2 { text-shadow: 0 0 10px var(--color-primario); }
        .hidden { display: none !important; }
        
        .hologram-btn { 
            background: rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--color-primario); 
            color: var(--color-primario); 
            padding: 10px 25px; 
            font-size: 1em; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 20px; 
            transition: 0.3s; 
            border-radius: 3px;
        }
        .hologram-btn:hover { 
            background: var(--color-primario); 
            color: #020202; 
            box-shadow: 0 0 15px var(--color-primario); 
        }

        .diploma-box { 
            border: 1px solid var(--color-primario); 
            padding: 20px; 
            margin: 20px auto; 
            max-width: 900px; 
            background: rgba(0, 0, 0, 0.8);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.1); 
            border-radius: 10px;
            position: relative;
            z-index: 10;
        }

        .file-input-group {
            margin: 10px 0;
            padding: 10px;
            font-size: 0.8em;
            color: #555;
        }

        .scanner-container {
            position: relative;
            overflow: hidden;
            border: 1px dashed var(--color-primario);
            padding: 40px 20px;
            margin-top: 15px;
        }
        
        .laser-vertical {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--color-primario);
            box-shadow: 0 0 15px 3px var(--color-primario);
            animation: scanAnimV 1.2s infinite linear;
        }

        @keyframes scanAnimV {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .glitch { animation: glitchAnim 2s infinite; }
        @keyframes glitchAnim {
            0% { opacity: 1; }
            90% { opacity: 1; }
            92% { opacity: 0.5; transform: translate(-2px, 2px); }
            94% { opacity: 0.8; transform: translate(2px, -2px); }
            100% { opacity: 1; }
        }

        canvas {
            max-width: 100%;
            height: auto;
            border: 2px solid var(--color-primario);
            border-radius: 5px;
            margin-top: 15px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            animation: fadeIn 1.5s ease-in-out;
            background: #fff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #sparks-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .spark-drop {
            position: absolute;
            top: -20px;
            width: 2px;
            height: 20px;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            animation: fall linear forwards;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        /* --- Animación Final de Robots --- */
        .celebration-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            padding: 20px;
        }
        .robot-emoji {
            font-size: 5rem;
            animation: jump 0.8s infinite alternate ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.3));
        }
        .robot-emoji.delay {
            animation-delay: 0.4s;
        }
        .pancarta {
            background: rgba(255, 255, 255, 0.1);
            border: 3px dashed #fff;
            padding: 15px 30px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 10px;
            animation: neonParty 1.5s infinite alternate;
        }
        
        @keyframes jump {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }
        @keyframes neonParty {
            0% { 
                border-color: #00ffcc; 
                color: #00ffcc;
                box-shadow: 0 0 10px #00ffcc, inset 0 0 10px #00ffcc; 
                text-shadow: 0 0 10px #00ffcc;
            }
            100% { 
                border-color: #ffaa00; 
                color: #ffaa00;
                box-shadow: 0 0 20px #ffaa00, inset 0 0 20px #ffaa00; 
                text-shadow: 0 0 20px #ffaa00;
            }
        }
    </style>
</head>
<body>
    <div id="sparks-container"></div>

    <h1 class="glitch" id="mainTitle">[ INICIALIZANDO KERNEL ]</h1>
    
    <div id="pantallaConfiguracion" class="diploma-box">
        <h2 style="color: #555;">Módulo de Diagnóstico</h2>
        <p style="color: #666; font-size: 0.9em;">Cargar paquete de datos local.</p>
        
        <div class="file-input-group">
            <label style="color: #888;">[PUERTO DE DATOS]: </label>
            <input type="file" id="pdf1" accept=".pdf">
        </div>

        <button id="btnIniciar" class="hologram-btn">Correr Diagnóstico</button>
        <p id="errorMsg" style="color: #ff0055; margin-top: 10px;" class="hidden">ERR: Paquete no detectado.</p>
    </div>

    <div id="pantallaEscaneo" class="diploma-box hidden">
        <h2 class="glitch" id="textoEscaneo">DESENCRIPTANDO MATRIZ...</h2>
        <div class="scanner-container">
            <div id="laserElement" class="laser-vertical"></div>
            <p id="subTextoEscaneo">Extrayendo credenciales del bloque de memoria...</p>
        </div>
    </div>
    
    <div id="pantallaResultado" class="diploma-box hidden">
        <h2 class="glitch" style="color: #fff; text-shadow: 0 0 15px var(--color-primario);" id="tituloResultado">¡CERTIFICACIÓN VALIDADA!</h2>
        <canvas id="pdfVisor"></canvas>
        <br>
        <button id="btnAccion" class="hologram-btn">Apagar Sistema</button>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'scan') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 2.0);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2.0);
                osc.start(); osc.stop(audioCtx.currentTime + 2.0);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'party') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
                osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.0);
                osc.start(); osc.stop(audioCtx.currentTime + 1.0);
            }
        }

        function playApplause() {
            initAudio();
            const bufferSize = audioCtx.sampleRate * 4;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const bandpass = audioCtx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.value = 1000;

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 4);

            noise.connect(bandpass);
            bandpass.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function createParticles() {
            const container = document.getElementById('sparks-container');
            container.innerHTML = ''; 
            for(let i=0; i<80; i++) {
                let p = document.createElement('div');
                p.className = 'spark-drop';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
                p.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(p);
            }
        }

        function renderPDF(url) {
            const canvas = document.getElementById('pdfVisor');
            const ctx = canvas.getContext('2d');
            pdfjsLib.getDocument(url).promise.then(pdf => {
                pdf.getPage(1).then(page => {
                    const viewport = page.getViewport({ scale: 2.0 });
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    page.render({ canvasContext: ctx, viewport: viewport });
                });
            });
        }

        const pantallaConfig = document.getElementById('pantallaConfiguracion');
        const pantallaEscaneo = document.getElementById('pantallaEscaneo');
        const pantallaResultado = document.getElementById('pantallaResultado');
        const mainTitle = document.getElementById('mainTitle');
        const textoEscaneo = document.getElementById('textoEscaneo');
        const subTextoEscaneo = document.getElementById('subTextoEscaneo');

        function procesarCandidato(archivo) {
            pantallaConfig.classList.add('hidden');
            pantallaResultado.classList.add('hidden');
            document.getElementById('sparks-container').innerHTML = '';
            
            pantallaEscaneo.classList.remove('hidden');
            mainTitle.innerText = `[ ANÁLISIS EN CURSO ]`;
            textoEscaneo.innerText = "COMPROBANDO FIRMA HOLOGRÁFICA...";
            subTextoEscaneo.innerText = "Extrayendo credenciales del bloque de memoria...";
            playSound('scan');

            const fileURL = URL.createObjectURL(archivo);
            renderPDF(fileURL);

            setTimeout(() => {
                pantallaEscaneo.classList.add('hidden');
                pantallaResultado.classList.remove('hidden');
                mainTitle.innerText = `[ PROTOCOLO DE RECONOCIMIENTO ACTIVO ]`;
                
                playApplause(); 
                createParticles();
            }, 3000);
        }

        document.getElementById('btnIniciar').addEventListener('click', () => {
            playSound('click');
            if (document.getElementById('pdf1').files.length === 0) {
                document.getElementById('errorMsg').classList.remove('hidden');
                return;
            }
            document.getElementById('errorMsg').classList.add('hidden');
            procesarCandidato(document.getElementById('pdf1').files[0]);
        });

        document.getElementById('btnAccion').addEventListener('click', () => {
            playSound('click');
            playSound('party');
            document.getElementById('sparks-container').innerHTML = '';
            mainTitle.innerText = `[ TRANSMISIÓN FINALIZADA ]`;
            
            pantallaResultado.innerHTML = `
                <h2 class="glitch" style="color: #ff0055;">SISTEMA APAGADO</h2>
                <p style="color: #888;">El registro ha sido entregado con éxito.</p>
                
                <div class="celebration-container">
                    <div class="robot-emoji">🤖</div>
                    <div class="pancarta">¡FELICIDADES MAKER!</div>
                    <div class="robot-emoji delay">🤖</div>
                </div>
            `;
        });
    </script>
</body>
</html>
